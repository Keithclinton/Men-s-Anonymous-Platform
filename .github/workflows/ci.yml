name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend — typecheck, lint, build
    runs-on: ubuntu-latest
    env:
      # prisma generate only needs these to be present, not reachable — no DB connection
      # happens at generate/typecheck/build time.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      VAULT_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_vault
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run typecheck:vercel
      - run: npm run lint
      - run: npm run build

  frontend:
    name: Frontend — typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      # Runs tsc -b then vite build — the same command Vercel runs, so a red check here
      # means the deploy would have failed too.
      - run: npm run build
